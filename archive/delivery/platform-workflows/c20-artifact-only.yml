name: C20 isolated real Quartz artifact verification

on:
  push:
    branches: [main]
    paths: ['deploy/c20-artifact-only/once-8986f868-c9a42e71.json']
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact reviewed main commit (no deployment or delivery publication)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c20-artifact-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'sep-zxy/zhizhi-platform' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '8986f8686ee0ae388fcb85ce6e45ad7eace19bbd' &&
        github.run_attempt == 1 && github.event.forced == false &&
        github.event.created == false && github.event.deleted == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Bind reviewed source before installing dependencies
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_SOURCE" == "$GITHUB_SHA" ]]
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13.16'
      - name: Verify exact event, baseline tree and one-time marker
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          uv run --no-project --offline python deploy/c20-artifact-only/event_gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Prepare locked dependencies (network allowed only here)
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project projects/growth --frozen --group dev --no-install-project
          uv run --project projects/growth --no-sync python deploy/c20-artifact-only/prepare_and_run.py --phase prepare --repo "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/c20-artifact-only" --source "$GITHUB_SHA"
      - name: Execute real Quartz in kernel-isolated network and mounts
        id: isolated_execution
        shell: bash
        run: |
          set -euo pipefail
          uv run --project projects/growth --no-sync python deploy/c20-artifact-only/prepare_and_run.py --phase execute --repo "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/c20-artifact-only" --source "$GITHUB_SHA"
      - name: Clean up only the exact container owned by this run
        id: isolated_cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --offline python deploy/c20-artifact-only/docker_executor.py --cleanup --work "$RUNNER_TEMP/c20-artifact-only" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Safely export bounded evidence without following payload links
        id: evidence_export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --offline python deploy/c20-artifact-only/export_evidence.py --work "$RUNNER_TEMP/c20-artifact-only"
      - name: Preserve bounded synthetic evidence, not live E2E approval
        id: evidence_artifact
        if: always() && steps.evidence_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: c20-real-quartz-synthetic-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/c20-artifact-only/evidence-export/
          if-no-files-found: error
          retention-days: 7
      - name: Summarize bounded evidence even if execution or upload failed
        if: always()
        shell: bash
        env:
          ARTIFACT_OUTCOME: ${{ steps.evidence_artifact.outcome }}
          EXECUTION_OUTCOME: ${{ steps.isolated_execution.outcome }}
          CLEANUP_OUTCOME: ${{ steps.isolated_cleanup.outcome }}
          EXPORT_OUTCOME: ${{ steps.evidence_export.outcome }}
        run: |
          set -euo pipefail
          uv run --no-project --offline python deploy/c20-artifact-only/summary.py --work "$RUNNER_TEMP/c20-artifact-only" --artifact-outcome "$ARTIFACT_OUTCOME" --execution-outcome "$EXECUTION_OUTCOME" --cleanup-outcome "$CLEANUP_OUTCOME" --export-outcome "$EXPORT_OUTCOME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --step-summary "$GITHUB_STEP_SUMMARY"
