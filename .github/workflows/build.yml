name: Build artifacts
on:
  workflow_dispatch:
    inputs:
      target:
        description: First-release component to build on Linux
        type: choice
        required: true
        default: backend
        options: [backend, learning-web, wiki-private, pi-zhizhi]
  workflow_call:
    inputs:
      target:
        type: string
        default: backend
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate first-release build target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET -cnotin @('backend','learning-web','wiki-private','pi-zhizhi')) {
            throw 'Unsupported Next first-release build target'
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install target and build wheel assets when needed
        env:
          TARGET: ${{ inputs.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/dev.ps1 install -Target $env:TARGET
          if ($env:TARGET -eq 'backend') {
            ./scripts/dev.ps1 install -Target learning-web
            ./scripts/dev.ps1 build -Target learning-web
          }
      - name: Build selected target
        env:
          TARGET: ${{ inputs.target }}
        run: ./scripts/dev.ps1 package -Target $env:TARGET
      - name: Smoke-test the packaged CLI and service entry points
        if: inputs.target == 'backend'
        run: |
          $ErrorActionPreference = 'Stop'
          $wheel = Get-ChildItem -LiteralPath 'artifacts/backend' -Filter '*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'Missing backend wheel' }
          Set-Location 'backend'
          uv pip install --python './.venv/bin/python' --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Backend wheel installation failed' }
          & './.venv/bin/ahadiff' --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI entry point failed' }
          & './.venv/bin/python' -m ahadiff.knowledge_platform --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged knowledge service entry point failed' }
      - name: Collect immutable artifacts
        env:
          TARGET: ${{ inputs.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts/distribution'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          switch ($env:TARGET) {
            'backend' { Copy-Item -Path 'artifacts/backend/*.whl' -Destination $out }
            'learning-web' { Copy-Item -LiteralPath 'apps/learning-web/dist' -Destination "$out/learning-web" -Recurse }
            'wiki-private' { Copy-Item -LiteralPath 'apps/wiki-private/dist' -Destination "$out/wiki-private" -Recurse }
            'pi-zhizhi' { Copy-Item -LiteralPath 'integrations/pi-zhizhi/dist' -Destination "$out/pi-extension" -Recurse }
          }
          ./scripts/build-receipt.ps1 -Target $env:TARGET -Output $out
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.target }}-linux-x64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/distribution/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
