name: Repository CI
on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-project python scripts/ci-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine affected components' }
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: 'true'
      - name: Install syntax parser only
        run: ./scripts/dev.ps1 install -Target learning-web
      - name: Parse active source and validate repository
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/dev.ps1 check -All
          uv run --no-project python scripts/check-repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository metadata checks failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace errors' }
  components:
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: ${{ contains(matrix.target, 'vault-manager') || contains(matrix.target, 'continuity-widget') }}
      - name: Install locked component dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/dev.ps1 install -Target $env:TARGET
      - name: Compile Quartz vendored dependencies and renderer
        if: matrix.target == 'public-wiki'
        run: ./scripts/dev.ps1 build -Target public-wiki
      - name: Types and unit behavior
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/dev.ps1 typecheck -Target $env:TARGET
          ./scripts/dev.ps1 test -Target $env:TARGET
      - name: Real isolated backend composition
        if: matrix.target == 'backend'
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/dev.ps1 test-integration -Target backend
          uv run --project backend --no-sync python backend/benchmarks/graphify/bench_graphify.py
          if ($LASTEXITCODE -ne 0) { throw 'Graphify performance check failed' }
      - name: Build affected application
        if: contains(fromJSON('["learning-web","wiki-private","pi-zhizhi","obsidian-ai-writer","vault-manager","continuity-widget"]'), matrix.target)
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/dev.ps1 build -Target $env:TARGET
      - name: Record exact scope
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          @{source=$env:GITHUB_SHA;target=$env:TARGET;run=$env:GITHUB_RUN_ID;real_account_e2e=$false;visual_review=$false} | ConvertTo-Json | Set-Content -LiteralPath "artifacts/ci-$env:TARGET.json" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 7
  required:
    name: Required checks
    if: always()
    needs: [plan, repository, components]
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          COMPONENT_RESULT: ${{ needs.components.result }}
          MODULES: ${{ needs.plan.outputs.modules }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PLAN_RESULT -ne 'success' -or $env:REPOSITORY_RESULT -ne 'success') { throw 'Repository checks did not pass' }
          if ($env:MODULES -ne '[]' -and $env:COMPONENT_RESULT -ne 'success') { throw 'Required component checks did not pass' }
          Write-Output 'All checks required by the affected-component plan passed; no live E2E is implied.'
