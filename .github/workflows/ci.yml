name: Repository CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - id: scope
        name: Select checks for the source under review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-project python scripts/ci-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine CI scope' }
      - name: Check maintained metadata and CI scope rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-project python scripts/check-repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository metadata checks failed' }
          uv run --no-project python -m unittest discover -s tests/repository -p test_ci_plan.py
          if ($LASTEXITCODE -ne 0) { throw 'CI scope tests failed' }
          $paths = @('.github','scripts','backend','apps/learning-web','apps/wiki-private','integrations/pi-zhizhi','knowledge-contracts')
          if ($env:BASE_SHA -match '^[0-9a-f]{40}$' -and $env:BASE_SHA -ne ('0' * 40)) {
            git diff --check $env:BASE_SHA HEAD -- @paths
          } else {
            git show --format= --check HEAD -- @paths
          }
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace check failed' }

  backend:
    name: Cloud CLI and API
    needs: repository
    if: needs.repository.outputs.scope == 'product'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: deps
        name: Install locked backend dependencies
        run: ./scripts/dev.ps1 install -Target backend
      - name: Verify supported SQLite and CLI entry points
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --project backend --no-sync python -c "import sqlite3; from ahadiff.core.sqlite_util import assert_sqlite_runtime_supported; print(sqlite3.sqlite_version); assert_sqlite_runtime_supported()"
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported SQLite runtime' }
          uv run --project backend --no-sync python -m ahadiff --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI entry point failed' }
          uv run --project backend --no-sync python -m ahadiff.knowledge_platform --help
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge service entry point failed' }
      - name: Check Python types
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./scripts/dev.ps1 typecheck -Target backend
      - name: Run backend unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./scripts/dev.ps1 test -Target backend
      - name: Run the API with isolated services and data
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./scripts/dev.ps1 test-integration -Target backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-api-reports-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/backend-unit.xml
            artifacts/backend-integration.xml
            artifacts/python-types*.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 7

  web:
    name: Web / ${{ matrix.target }}
    needs: repository
    if: needs.repository.outputs.scope == 'product'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [learning-web, wiki-private]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install locked dependencies
        run: ./scripts/dev.ps1 install -Target $env:TARGET
      - name: Install Chromium
        run: |
          $ErrorActionPreference = 'Stop'
          node "apps/$env:TARGET/node_modules/@playwright/test/cli.js" install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Check Web types
        run: ./scripts/dev.ps1 typecheck -Target $env:TARGET
      - name: Run Web unit tests
        run: ./scripts/dev.ps1 test -Target $env:TARGET
      - name: Run Web journeys with API fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "apps/$env:TARGET"
          $argsForPlaywright = @('node_modules/@playwright/test/cli.js','test','--config','playwright.ci.config.ts')
          if ($env:TARGET -eq 'learning-web') { $argsForPlaywright += 'tests/e2e/zhizhi-domain.spec.ts' }
          node @argsForPlaywright
          if ($LASTEXITCODE -ne 0) { throw 'Browser fixture interaction failed' }
      - name: Build private Wiki
        if: matrix.target == 'wiki-private'
        run: ./scripts/dev.ps1 build -Target $env:TARGET
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-${{ matrix.target }}-reports-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/browser-*.xml
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 7

  agent:
    name: Agent tool protocol
    needs: repository
    if: needs.repository.outputs.scope == 'product'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install locked Python and Agent dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/dev.ps1 install -Target backend
          ./scripts/dev.ps1 install -Target pi-zhizhi
      - name: Check Agent types
        run: ./scripts/dev.ps1 typecheck -Target pi-zhizhi
      - name: Run Agent unit tests
        run: ./scripts/dev.ps1 test -Target pi-zhizhi
      - name: Exercise the Python bridge without real model calls
        run: ./scripts/dev.ps1 test-integration -Target pi-zhizhi
      - name: Build Agent integration
        run: ./scripts/dev.ps1 build -Target pi-zhizhi

  package:
    name: Cloud CLI package
    needs: repository
    if: needs.repository.outputs.scope == 'product'
    uses: ./.github/workflows/build.yml
    with:
      target: backend

  required:
    name: Required checks
    if: always()
    needs: [repository, backend, web, agent, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every job required by this scope
        env:
          SCOPE: ${{ needs.repository.outputs.scope }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = $env:RESULTS | ConvertFrom-Json -AsHashtable
          $summary = @("Source: $env:GITHUB_SHA", "Scope: $env:SCOPE", '', '| Job | Result |', '| --- | --- |')
          foreach ($job in $results.GetEnumerator()) {
            $summary += "| $($job.Key) | $($job.Value.result) |"
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          if ($results.repository.result -ne 'success') { throw 'Repository policy did not pass' }
          if ($env:SCOPE -notin 'metadata','product') { throw 'Unknown CI scope' }
          $expected = if ($env:SCOPE -eq 'product') { 'success' } else { 'skipped' }
          foreach ($name in 'backend','web','agent','package') {
            if ($results[$name].result -ne $expected) { throw "$name expected $expected, got $($results[$name].result)" }
          }
