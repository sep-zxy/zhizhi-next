name: Windows Git acceptance candidate

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact reviewed main source commit to build
        required: true
        type: string
      expected_delivery:
        description: Exact current windows-delivery commit, preserved as rollback parent
        required: true
        type: string
      publish_candidate:
        description: Explicitly permit publishing the verified candidate to windows-delivery
        required: true
        default: false
        type: boolean
      maximum_product_bytes:
        description: Reviewed maximum uncompressed bytes to add to the private Git delivery branch
        required: true
        default: '1000000000'
        type: string

permissions:
  contents: read

concurrency:
  group: audited-windows-delivery-write
  cancel-in-progress: false

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    if: github.repository == 'sep-zxy/zhizhi-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind manual request to immutable source and rollback parent
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          EXPECTED_DELIVERY: ${{ inputs.expected_delivery }}
          MAXIMUM_PRODUCT_BYTES: ${{ inputs.maximum_product_bytes }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DELIVERY" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE" == "$GITHUB_SHA" ]]
          [[ "$MAXIMUM_PRODUCT_BYTES" =~ ^[0-9]{1,10}$ ]]
          (( MAXIMUM_PRODUCT_BYTES > 0 && MAXIMUM_PRODUCT_BYTES <= 2000000000 ))
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13.16'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project projects/growth --frozen --group dev --extra wechat --extra captions
          pnpm --dir projects/growth/viewer install --frozen-lockfile
      - name: Run isolated gates and build fresh Windows product
        shell: bash
        run: |
          set -euo pipefail
          uv run --project projects/growth --no-sync python deploy/windows-portable/build_github_product.py \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/windows-product"
      - name: Transfer immutable candidate within this workflow
        uses: actions/upload-artifact@v4
        with:
          name: windows-git-candidate
          path: |
            ${{ runner.temp }}/windows-product/bundle/
            ${{ runner.temp }}/windows-product/evidence/github-build-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record isolated evidence, not live E2E approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-build-evidence
          path: ${{ runner.temp }}/windows-product/evidence/
          if-no-files-found: warn
          retention-days: 14

  publish-candidate:
    needs: build
    if: inputs.publish_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-git-candidate
          path: ${{ runner.temp }}/candidate-input
      - name: Verify build provenance and atomically publish candidate Git ref
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          EXPECTED_DELIVERY: ${{ inputs.expected_delivery }}
          MAXIMUM_PRODUCT_BYTES: ${{ inputs.maximum_product_bytes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-project python deploy/git-sync/ci_delivery.py \
            --bundle "$RUNNER_TEMP/candidate-input/bundle" \
            --build-receipt "$RUNNER_TEMP/candidate-input/evidence/github-build-receipt.json" \
            --expected-source "$EXPECTED_SOURCE" \
            --stage "$RUNNER_TEMP/candidate-stage" \
            --maximum-product-bytes "$MAXIMUM_PRODUCT_BYTES" \
            --publish-expected-delivery "$EXPECTED_DELIVERY" \
            --receipt "$RUNNER_TEMP/candidate-publication.json"
      - name: Record exact Git delivery commit and rollback parent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-publication-receipt
          path: ${{ runner.temp }}/candidate-publication.json
          if-no-files-found: warn
          retention-days: 14
